<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Jam App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e6;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }

  /* Subtle animated gradient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, rgba(29, 185, 84, 0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 20%, rgba(30, 215, 96, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse 100% 100% at 50% 50%, rgba(16, 16, 24, 1) 0%, rgba(10, 10, 15, 1) 100%);
    animation: bgPulse 6s ease-in-out infinite alternate;
    z-index: -1;
  }

  @keyframes bgPulse {
    0%   { opacity: 0.8; }
    100% { opacity: 1; }
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    animation: fadeInUp 0.8s ease-out;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Icon / logo area */
  .logo-ring {
    position: relative;
    width: 96px;
    height: 96px;
  }

  .logo-ring .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2.5px solid transparent;
    border-top-color: #1db954;
    animation: spin 1.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  }

  .logo-ring .ring:nth-child(2) {
    inset: 8px;
    border-top-color: rgba(29, 185, 84, 0.5);
    animation-duration: 2.4s;
    animation-direction: reverse;
  }

  .logo-ring .ring:nth-child(3) {
    inset: 16px;
    border-top-color: rgba(29, 185, 84, 0.25);
    animation-duration: 3.2s;
  }

  /* Spotify-style sound bars in the centre */
  .bars {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 24px;
  }

  .bars span {
    display: block;
    width: 3.5px;
    border-radius: 2px;
    background: #1db954;
    animation: barPulse 1s ease-in-out infinite;
  }

  .bars span:nth-child(1) { height: 8px;  animation-delay: 0.0s; }
  .bars span:nth-child(2) { height: 16px; animation-delay: 0.15s; }
  .bars span:nth-child(3) { height: 24px; animation-delay: 0.3s; }
  .bars span:nth-child(4) { height: 12px; animation-delay: 0.45s; }
  .bars span:nth-child(5) { height: 20px; animation-delay: 0.6s; }

  @keyframes barPulse {
    0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
    50%      { transform: scaleY(1);   opacity: 1; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Text */
  .text-group {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .app-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #1db954 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .status-text {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.01em;
  }

  /* Progress track */
  .progress-track {
    width: 200px;
    height: 3px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #1db954, #1ed760);
    border-radius: 3px;
    animation: indeterminate 2s ease-in-out infinite;
  }

  @keyframes indeterminate {
    0%   { width: 10%; margin-left: 0; }
    50%  { width: 40%; margin-left: 30%; }
    100% { width: 10%; margin-left: 90%; }
  }

  /* Elapsed timer */
  .elapsed {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.25);
    font-variant-numeric: tabular-nums;
    margin-top: -8px;
  }
</style>
</head>
<body>

<div class="splash-container">
  <div class="logo-ring">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="text-group">
    <div class="app-name">Spotify Jam</div>
    <div class="status-text" id="status">Starting up…</div>
  </div>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

  <div class="elapsed" id="elapsed"></div>
</div>

<script>
  const statusEl  = document.getElementById('status');
  const elapsedEl = document.getElementById('elapsed');
  const start = Date.now();

  const messages = [
    { after:  0, text: 'Starting up…' },
    { after:  3, text: 'Initializing backend…' },
    { after: 10, text: 'Loading modules…' },
    { after: 25, text: 'Setting up database…' },
    { after: 45, text: 'Almost there…' },
    { after: 75, text: 'Finishing up…' },
  ];

  setInterval(() => {
    const secs = Math.floor((Date.now() - start) / 1000);
    elapsedEl.textContent = secs > 3 ? `${secs}s` : '';

    // Walk through status messages
    for (let i = messages.length - 1; i >= 0; i--) {
      if (secs >= messages[i].after) {
        statusEl.textContent = messages[i].text;
        break;
      }
    }
  }, 500);
</script>

</body>
</html>
